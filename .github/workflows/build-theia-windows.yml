name: Build CONTINUUM Theia IDE (Windows)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/theia/**"
      - "docs/theia-migration.md"
      - ".github/workflows/build-theia-windows.yml"

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Set up Python for native Node modules
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enable Yarn Classic
        shell: pwsh
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version
      - name: Validate configuration
        run: node scripts/validate-config.mjs
        working-directory: apps/theia
      - name: Install Theia workbench dependencies
        env:
          PYTHON: ${{ steps.setup-python.outputs.python-path }}
          npm_config_python: ${{ steps.setup-python.outputs.python-path }}
        run: yarn install --network-timeout 600000
        working-directory: apps/theia
      - name: Build CONTINUUM Theia IDE and package NSIS installer
        run: yarn package:win
        working-directory: apps/theia
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: CONTINUUM-Theia-Windows-x64
          path: apps/theia/release/*.exe
          if-no-files-found: error
          retention-days: 30
