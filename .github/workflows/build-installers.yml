name: Build native desktop installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/native/**"
      - ".github/workflows/build-installers.yml"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      CONTINUUM_CLOUD_API_URL: ${{ secrets.CONTINUUM_CLOUD_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/native/requirements-build.txt
      - name: Install native app and packaging dependencies
        working-directory: apps/native
        run: python -m pip install -r requirements-build.txt
      - name: Test safe local workspace behavior
        working-directory: apps/native
        run: python -m unittest discover -s tests -v
      - name: Smoke test native Qt workbench
        working-directory: apps/native
        env:
          QT_QPA_PLATFORM: offscreen
        run: python smoke_ui.py
      - name: Generate release cloud configuration from repository secrets
        working-directory: apps/native
        shell: pwsh
        run: |
          python generate_config.py
          if ($LASTEXITCODE -ne 0) { throw "Release cloud configuration failed. Add SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, and CONTINUUM_CLOUD_API_URL to GitHub Actions repository secrets." }
      - name: Package native desktop application
        working-directory: apps/native
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name CONTINUUM --collect-all PySide6 --hidden-import keyring.backends.Windows --hidden-import keyring.backends.SecretService main.py
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Create Windows installer
        working-directory: apps/native
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler was not found." }
          & $iscc "installer\continuum.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed to create the installer." }
      - uses: actions/upload-artifact@v4
        with:
          name: CONTINUUM-Native-Windows-Installer
          path: apps/native/release/CONTINUUM-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
