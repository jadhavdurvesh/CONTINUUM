name: Validate application

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web dependencies
        working-directory: apps/web
        run: npm install
      - name: Type-check and build dashboard
        working-directory: apps/web
        run: npm run build
      - name: Transpile-check Vercel API functions
        working-directory: apps/web
        run: |
          npx esbuild api/agents/status.ts --platform=node --format=esm --outfile=/tmp/agents-status.mjs
          npx esbuild api/agents/run-step.ts --platform=node --format=esm --outfile=/tmp/agents-run-step.mjs

  theia-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check Theia package and cloud-architecture boundaries
        run: |
          node --check apps/theia/scripts/validate-config.mjs
          node apps/theia/scripts/validate-config.mjs

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check native Python syntax
        working-directory: apps/native
        run: python -m compileall -q continuum main.py generate_config.py
      - name: Test native workspace safety
        working-directory: apps/native
        run: python -m unittest discover -s tests -v

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        working-directory: services/api
        run: python -m pip install -e ".[dev]"
      - name: Run API tests
        working-directory: services/api
        run: pytest

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install worker dependencies
        working-directory: services/worker
        run: python -m pip install -e ".[dev]"
      - name: Run worker security and API tests
        working-directory: services/worker
        run: pytest
