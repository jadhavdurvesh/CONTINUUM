name: Validate application

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Type-check (dashboard + API functions) and build
        working-directory: apps/web
        run: npm run build
      - name: Test Vercel API helpers (CORS, proposal validation)
        working-directory: apps/web
        run: npm run test:api

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations and run SQL tests
        env:
          PGURL: postgres://postgres:postgres@localhost:5432/postgres
        run: bash supabase/tests/run.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dashboard queries end to end (PostgREST + JWT + RLS)
        env:
          PGURL: postgres://postgres:postgres@localhost:5432/postgres
        run: bash supabase/tests/api-smoke/run.sh

  theia-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check Theia package and cloud-architecture boundaries
        run: |
          node --check apps/theia/scripts/validate-config.mjs
          node apps/theia/scripts/validate-config.mjs

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check native Python syntax
        working-directory: apps/native
        run: python -m compileall -q continuum main.py generate_config.py
      - name: Test native workspace safety
        working-directory: apps/native
        run: python -m unittest discover -s tests -v

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        working-directory: services/api
        run: python -m pip install -e ".[dev]"
      - name: Run API tests
        working-directory: services/api
        run: pytest

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install worker dependencies
        working-directory: services/worker
        run: python -m pip install -e ".[dev]"
      - name: Run worker security and API tests
        working-directory: services/worker
        run: pytest
